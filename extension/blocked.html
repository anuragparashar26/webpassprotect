<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPassProtect Auth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="lock-body">
  <div class="lock-wrapper">
    <div class="lock-card">
      <div class="lock-header">
        <div class="lock-shield">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>Site Locked</h1>
        <p class="lock-subtitle">This site is protected</p>
      </div>

      <div class="lock-domain-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="domain"></span>
      </div>

      <form id="unlock-form" class="lock-form">
        <label for="password">Enter password to continue</label>
        <div class="lock-input-group">
          <input type="password" id="password" placeholder="Password" autocomplete="off" autofocus>
          <button type="submit">
            <span>Unlock</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </form>

      <div class="lock-error" id="error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <span>Incorrect password. Try again.</span>
      </div>

      <div class="lock-footer">
        <p>Enter the correct password to unlock access to this site.</p>
      </div>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
